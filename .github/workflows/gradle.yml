name: Java CI with Gradle and SonarCloud

on:
  push:
    branches: [ "main", "CI/CD" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build project
      run: ./gradlew build

    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=katepolitykina
          -Dsonar.projectKey=katePolitykina_IW_User_Service
          -Dsonar.java.binaries=build
    - name: Build Docker image
      run: |
        docker build -t user-service:${{ github.sha }} .
        mkdir -p docker-image
        docker save user-service:${{ github.sha }} -o docker-image/user-service.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: user-service-docker-image
        path: docker-image/user-service.tar

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
